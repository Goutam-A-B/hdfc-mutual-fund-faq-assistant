# Phase 7 — Scheduled corpus refresh.
# Re-runs the same offline ingestion pipeline used locally (npm run ingest)
# daily and commits updated corpus artifacts back to the default branch.
# The Vercel deployment (connected to this repo) will redeploy on that push.

name: Refresh corpus

on:
  schedule:
    # 05:00 UTC, daily (= 10:30 IST). Cron is always UTC on GitHub
    # (edge case 7.11).
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# A single in-flight refresh at a time — prevents the cron and a manual
# workflow_dispatch from racing on the same branch (edge case 7.8).
concurrency:
  group: refresh-corpus
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Playwright needs its browser binaries + Linux system libraries
      # (edge case 7.1). --with-deps installs both.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Same pipeline as `npm run ingest` locally: 1-fetch → 2-extract →
      # 3-build-index → 4-build-facts. 1-fetch fails the job loudly if any
      # scheme-page 404s (edge case 7.5); non-critical source failures only
      # warn. 3-build-index respects the per-chunk embedding cache so a
      # re-run only re-embeds chunks whose content actually changed
      # (edge case 7.12).
      - name: Run ingestion pipeline
        run: npm run ingest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # Commit corpus artifacts back to the default branch.
      #
      # This keeps the deployed app's data fresh without requiring a manual PR
      # merge each day. If your repository has branch protection that blocks
      # GITHUB_TOKEN pushes, switch back to the PR-based workflow.
      - name: Auto-commit updated corpus (if changed)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh corpus artifacts (scheduled)"
          file_pattern: corpus/
